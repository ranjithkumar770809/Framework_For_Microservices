# ==============================================================================
# Product Service Configuration (Port 8081)
# ==============================================================================
server.port=8081
spring.application.name=product-service

# Default: In-Memory / File Database (H2) for Instant Zero-Config Execution
spring.datasource.url=jdbc:h2:mem:product_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info

# Banner
spring.main.banner-mode=off
