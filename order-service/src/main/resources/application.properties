# ==============================================================================
# Order Service Configuration (Port 8082)
# ==============================================================================
server.port=8082
spring.application.name=order-service

# Persistent Embedded Database (saved in ./data/order_db) for zero-config persistence
spring.datasource.url=jdbc:h2:file:./data/order_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8082/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inter-Service Communication - Product Service Endpoint
product-service.base-url=http://localhost:8081/api/products

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info

# Banner
spring.main.banner-mode=off